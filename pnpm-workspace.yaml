packages:
  - '**'
  - '!dist'
  - '!**/dist/**'
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@swc/core': false
  esbuild: false
  msw: false
  prisma: true
  sharp: false
minimumReleaseAgeExclude:
  - '@umami/react-zen'
# Keep in sync with "pnpm.overrides" in package.json (pnpm 11 only reads this file; pnpm 9/10 read package.json).
overrides:
  'shell-quote@1': 1.12.0
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'minimatch@3': 3.1.5
  'minimatch@5': 5.1.9
  'minimatch@9': 9.0.9
  'fast-uri@3': 3.1.9
  'js-yaml@4': 4.3.2
  'svgo@3': 3.3.5
  'nanoid@3': 3.3.20
  'mysql2@3': 3.24.6
  'source-map-js@1': 1.2.2
  'browserslist@4': 4.29.5
  'undici@8': 8.12.3
  'vite@8': 8.3.5
